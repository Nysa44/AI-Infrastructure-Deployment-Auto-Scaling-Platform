apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: inference-api}
  template:
    metadata:
      labels: {app: inference-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ai-inference-platform:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: {name: inference-config}
          env:
            - name: DEMO_SECRET
              valueFrom:
                secretKeyRef: {name: inference-secret, key: DEMO_SECRET}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: inference-api
  namespace: ai-platform
spec:
  selector: {app: inference-api}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-api
  namespace: ai-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
