apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 3
          livenessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ai-platform
spec:
  selector: {app: redis}
  ports:
    - port: 6379
      targetPort: 6379
