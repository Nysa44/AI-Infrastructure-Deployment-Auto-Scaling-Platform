apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-worker
  namespace: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: inference-worker}
  template:
    metadata:
      labels: {app: inference-worker}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: ai-inference-platform:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef: {name: inference-config}
          env:
            - name: REDIS_CONSUMER
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-worker
  namespace: ai-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
apiVersion: v1
kind: Service
metadata:
  name: inference-worker-metrics
  namespace: ai-platform
spec:
  selector:
    app: inference-worker
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
